# A workflow to build the platform(s) in this repository and boots them with the specified OS images.
#
# Please refer to [docs/src/testing/regression_testing.md](https://github.com/OpenDevicePartnership/patina-qemu/tree/main/docs/src/testing/regression_testing.md)
# for more information on regression testing performed in this repository, including OS boot tests.
#
##
# Copyright (c) Microsoft Corporation.
#
# SPDX-License-Identifier: BSD-2-Clause-Patent
##
name: "Nightly OS Boot Test"

on:
  schedule:
    - cron: '0 6 * * *'  # Runs daily at 06:00 UTC
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs when a new commit is pushed to the same PR. For non-PR events
# (schedule, workflow_dispatch) `github.head_ref` is empty, so the fallback to `github.run_id`
# gives each run a unique group and prevents those runs from cancelling each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  vars:
    name: Get Repository Constants
    uses: OpenDevicePartnership/patina-devops/.github/workflows/qemu-constants.yml@main

  # Resolves the Patina versions under test. The DXE Core flashed by this workflow is a prebuilt
  # release from patina-dxe-core-qemu (as pinned in QemuPkg/Binaries/DXECORE.QEMU_ext_dep.json),
  # so the Patina version is determined by the Cargo.lock of the specified patina-dxe-core-qemu release.
  resolve-environment:
    name: Resolve Environment Versions

    runs-on: ubuntu-latest

    outputs:
      patina-sdk-version: ${{ steps.versions.outputs.patina-sdk-version }}
      patina-dxe-core-qemu-version: ${{ steps.versions.outputs.patina-dxe-core-qemu-version }}
      patina-qemu-commit: ${{ steps.versions.outputs.patina-qemu-commit }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve Patina versions
        id: versions
        run: |
          dxe_core_qemu_version=$(jq -r '.version' QemuPkg/Binaries/DXECORE.QEMU_ext_dep.json)
          [ -n "${dxe_core_qemu_version}" ] && [ "${dxe_core_qemu_version}" != "null" ] || \
            (echo "Failed to read the patina-dxe-core-qemu version from the ext_dep JSON file" >&2; exit 1)

          lock_url="https://raw.githubusercontent.com/OpenDevicePartnership/patina-dxe-core-qemu/v${dxe_core_qemu_version}/Cargo.lock"
          patina_sdk_version=$(curl -fsSL "${lock_url}" | awk '/^name = "patina"$/{f=1; next} f{gsub(/"/,"",$3); print $3; exit}')
          [ -n "${patina_sdk_version}" ] || (echo "Failed to resolve the Patina SDK version from ${lock_url}" >&2; exit 1)

          echo "patina-dxe-core-qemu-version=${dxe_core_qemu_version}" >> $GITHUB_OUTPUT
          echo "patina-sdk-version=${patina_sdk_version}" >> $GITHUB_OUTPUT
          echo "patina-qemu-commit=${{ github.sha }}" >> $GITHUB_OUTPUT

  prepare-os-images:
    name: Prepare OS Boot Images

    needs: vars

    strategy:
      matrix:
        include:
          - img-url: ${{ needs.vars.outputs.ubuntu-x64-image }}
            artifact-name: ${{ needs.vars.outputs.ubuntu-x64-artifact }}
          - img-url: ${{ needs.vars.outputs.ubuntu-aarch64-image }}
            artifact-name: ${{ needs.vars.outputs.ubuntu-aarch64-artifact }}
          - img-url: ${{ needs.vars.outputs.windows-x64-image }}
            artifact-name: ${{ needs.vars.outputs.windows-x64-artifact }}
          - img-url: ${{ needs.vars.outputs.windows-aarch64-image }}
            artifact-name: ${{ needs.vars.outputs.windows-aarch64-artifact }}

    uses: ./.github/workflows/prepare-images.yml
    with:
      image-url: ${{ matrix.img-url }}
      artifact-name: ${{ matrix.artifact-name }}

  boot-with-os:
    name: Boot ${{ contains(matrix.os-artifact, 'windows') && 'Windows' || 'Ubuntu' }} ${{ matrix.os-boot-device }} ${{ matrix.platform }} ${{ matrix.target }}
    needs:
      - prepare-os-images
      - vars

    runs-on: 'ubuntu-latest'

    container:
      image: ${{ needs.vars.outputs.container-image }}
      options: --security-opt seccomp=unconfined

    timeout-minutes: 30

    env:
      OS_BOOT_ARTIFACTS_PATH: ./os-boot-artifacts

    strategy:
      fail-fast: false
      matrix:
        include:
          # SSD Q35 DEBUG X64 (Boot to Ubuntu)
          - config: 'Platforms/QemuQ35Pkg/PlatformBuild.py'
            target: 'DEBUG'
            platform: 'Q35'
            os-artifact: ${{ needs.vars.outputs.ubuntu-x64-artifact }}
            os-boot-device: SSD
            extra-args: PATH_TO_OS=./os-boot-artifacts/image.qcow2 PATH_TO_SEED=./os-boot-artifacts/seed.iso
          # SSD Q35 RELEASE X64 (Boot to Ubuntu)
          - config: 'Platforms/QemuQ35Pkg/PlatformBuild.py'
            target: 'RELEASE'
            platform: 'Q35'
            os-artifact: ${{ needs.vars.outputs.ubuntu-x64-artifact }}
            os-boot-device: SSD
            extra-args: PATH_TO_OS=./os-boot-artifacts/image.qcow2 PATH_TO_SEED=./os-boot-artifacts/seed.iso
          # SSD ArmVirt DEBUG (Boot to Ubuntu)
          - config: 'Platforms/QemuArmVirtPkg/PlatformBuild.py'
            target: 'DEBUG'
            platform: 'ArmVirt'
            os-artifact: ${{ needs.vars.outputs.ubuntu-aarch64-artifact }}
            os-boot-device: SSD
            extra-args: PATH_TO_OS=./os-boot-artifacts/image.qcow2 PATH_TO_SEED=./os-boot-artifacts/seed.iso
          # SSD ArmVirt RELEASE (Boot to Ubuntu)
          - config: 'Platforms/QemuArmVirtPkg/PlatformBuild.py'
            target: 'RELEASE'
            platform: 'ArmVirt'
            os-artifact: ${{ needs.vars.outputs.ubuntu-aarch64-artifact }}
            os-boot-device: SSD
            extra-args: PATH_TO_OS=./os-boot-artifacts/image.qcow2 PATH_TO_SEED=./os-boot-artifacts/seed.iso
          # SSD Q35 DEBUG X64 (Boot to Windows)
          - config: 'Platforms/QemuQ35Pkg/PlatformBuild.py'
            target: 'DEBUG'
            platform: 'Q35'
            os-artifact: ${{ needs.vars.outputs.windows-x64-artifact }}
            os-boot-device: SSD
            extra-args: PATH_TO_OS=./os-boot-artifacts/image.qcow2
          # SSD Q35 RELEASE X64 (Boot to Windows)
          - config: 'Platforms/QemuQ35Pkg/PlatformBuild.py'
            target: 'RELEASE'
            platform: 'Q35'
            os-artifact: ${{ needs.vars.outputs.windows-x64-artifact }}
            os-boot-device: SSD
            extra-args: PATH_TO_OS=./os-boot-artifacts/image.qcow2
          # SSD ArmVirt DEBUG (Boot to Windows)
          - config: 'Platforms/QemuArmVirtPkg/PlatformBuild.py'
            target: 'DEBUG'
            platform: 'ArmVirt'
            os-artifact: ${{ needs.vars.outputs.windows-aarch64-artifact }}
            os-boot-device: SSD
            extra-args: PATH_TO_OS=./os-boot-artifacts/image.qcow2
          # SSD ArmVirt RELEASE (Boot to Windows)
          - config: 'Platforms/QemuArmVirtPkg/PlatformBuild.py'
            target: 'RELEASE'
            platform: 'ArmVirt'
            os-artifact: ${{ needs.vars.outputs.windows-aarch64-artifact }}
            os-boot-device: SSD
            extra-args: PATH_TO_OS=./os-boot-artifacts/image.qcow2
          # USB Q35 DEBUG X64 (Boot to Ubuntu)
          - config: 'Platforms/QemuQ35Pkg/PlatformBuild.py'
            target: 'DEBUG'
            platform: 'Q35'
            os-artifact: ${{ needs.vars.outputs.ubuntu-x64-artifact }}
            os-boot-device: USB
            extra-args: PATH_TO_OS=./os-boot-artifacts/image.qcow2 PATH_TO_SEED=./os-boot-artifacts/seed.iso
          # USB Q35 RELEASE X64 (Boot to Ubuntu)
          - config: 'Platforms/QemuQ35Pkg/PlatformBuild.py'
            target: 'RELEASE'
            platform: 'Q35'
            os-artifact: ${{ needs.vars.outputs.ubuntu-x64-artifact }}
            os-boot-device: USB
            extra-args: PATH_TO_OS=./os-boot-artifacts/image.qcow2 PATH_TO_SEED=./os-boot-artifacts/seed.iso
          # USB ArmVirt DEBUG (Boot to Ubuntu)
          - config: 'Platforms/QemuArmVirtPkg/PlatformBuild.py'
            target: 'DEBUG'
            platform: 'ArmVirt'
            os-artifact: ${{ needs.vars.outputs.ubuntu-aarch64-artifact }}
            os-boot-device: USB
            extra-args: PATH_TO_OS=./os-boot-artifacts/image.qcow2 PATH_TO_SEED=./os-boot-artifacts/seed.iso
          # USB ArmVirt RELEASE (Boot to Ubuntu)
          - config: 'Platforms/QemuArmVirtPkg/PlatformBuild.py'
            target: 'RELEASE'
            platform: 'ArmVirt'
            os-artifact: ${{ needs.vars.outputs.ubuntu-aarch64-artifact }}
            os-boot-device: USB
            extra-args: PATH_TO_OS=./os-boot-artifacts/image.qcow2 PATH_TO_SEED=./os-boot-artifacts/seed.iso
          # USB Q35 DEBUG X64 (Boot to Windows)
          - config: 'Platforms/QemuQ35Pkg/PlatformBuild.py'
            target: 'DEBUG'
            platform: 'Q35'
            os-artifact: ${{ needs.vars.outputs.windows-x64-artifact }}
            os-boot-device: USB
            extra-args: PATH_TO_OS=./os-boot-artifacts/image.qcow2
          # USB Q35 RELEASE X64 (Boot to Windows)
          - config: 'Platforms/QemuQ35Pkg/PlatformBuild.py'
            target: 'RELEASE'
            platform: 'Q35'
            os-artifact: ${{ needs.vars.outputs.windows-x64-artifact }}
            os-boot-device: USB
            extra-args: PATH_TO_OS=./os-boot-artifacts/image.qcow2
          # USB ArmVirt DEBUG (Boot to Windows)
          - config: 'Platforms/QemuArmVirtPkg/PlatformBuild.py'
            target: 'DEBUG'
            platform: 'ArmVirt'
            os-artifact: ${{ needs.vars.outputs.windows-aarch64-artifact }}
            os-boot-device: USB
            extra-args: PATH_TO_OS=./os-boot-artifacts/image.qcow2
          # USB ArmVirt RELEASE (Boot to Windows)
          - config: 'Platforms/QemuArmVirtPkg/PlatformBuild.py'
            target: 'RELEASE'
            platform: 'ArmVirt'
            os-artifact: ${{ needs.vars.outputs.windows-aarch64-artifact }}
            os-boot-device: USB
            extra-args: PATH_TO_OS=./os-boot-artifacts/image.qcow2

    steps:
      # Checkout the repository to the runner or container
      - name: Checkout repository
        uses: actions/checkout@v7

      # Configure git for use in the container. Specifically needed for the FFA builds
      - name: Configure Git
        uses: ./.github/actions/configure-git

      # Install the pip dependencies needed to run stuart for the platform(s)
      - name: Install dependencies
        run: pip install -r pip-requirements.txt

      - name: Redirect Hafnium Submodule URLs
        uses: ./.github/actions/redirect-hafnium-urls

      - name: Download OS Boot Artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.os-artifact }}
          path: ${{ env.OS_BOOT_ARTIFACTS_PATH }}

      # Run the build-platform action, which calls stuart_setup, stuart_update, and stuart_build
      - name: Prepare and Build
        id: build-platform
        uses: ./.github/actions/build-platform
        with:
          command: 'build'
          platform-config: ${{ matrix.config }}
          platform-name: ${{ matrix.platform }}
          target: ${{ matrix.target }}
          stuart-args: 'QEMU_HEADLESS=TRUE ${{ matrix.extra-args }} OS_BOOT_DEVICE=${{ matrix.os-boot-device}}'

      - name: Run
        id: run
        uses: ./.github/actions/build-platform
        with:
          command: 'flash'
          platform-config: ${{ matrix.config }}
          platform-name: ${{ matrix.platform }}
          target: ${{ matrix.target }}
          stuart-args: 'QEMU_HEADLESS=TRUE ${{ matrix.extra-args }} OS_BOOT_DEVICE=${{ matrix.os-boot-device}}'

      # Records a per-target pass/fail result for the Patina Compatibility Matrix, independent of build/flash outcome.
      - name: Generate compatibility cell metadata
        id: compat-cell
        if: always()
        run: |
          cell_id=$(printf '%s' "${{ matrix.platform }}-${{ matrix.target }}-${{ matrix.os-boot-device }}-${{ matrix.os-artifact }}" | tr '[:upper:]' '[:lower:]')

          if [ "${{ steps.build-platform.outcome }}" = "success" ] && [ "${{ steps.run.outcome }}" = "success" ]; then
            result="success"
          else
            result="failure"
          fi

          mkdir -p compat-data
          cat > "compat-data/${cell_id}.json" <<EOF
          {
            "schema_version": 1,
            "cell_id": "${cell_id}",
            "platform": "${{ matrix.platform }}",
            "target": "${{ matrix.target }}",
            "os_boot_device": "${{ matrix.os-boot-device }}",
            "os_artifact": "${{ matrix.os-artifact }}",
            "result": "${result}",
            "run_id": "${{ github.run_id }}",
            "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          echo "cell-id=${cell_id}" >> $GITHUB_OUTPUT

      - name: Upload compatibility cell metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compat-cell-${{ steps.compat-cell.outputs.cell-id }}
          path: compat-data/${{ steps.compat-cell.outputs.cell-id }}.json
          retention-days: 1

      - name: Publish Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Specify architecture if it is not empty
          name: build-logs-${{ matrix.os-boot-device }}-${{ matrix.platform }}-${{ matrix.target }}-${{ contains(matrix.os-artifact, 'windows') && 'windows' || 'ubuntu' }}
          path: ${{ steps.build-platform.outputs.log-path }}

  # Opens a tracking issue when the scheduled (cron) run fails to boot an OS.
  # the `prepare-os-images` job sporadically fails due to network issues, which
  # would typically cause this job to run and open an issue. This job triggers only
  # when the `boot-with-os` job fails.
  report-failure:
    name: Report Nightly Failure
    needs: boot-with-os
    if: ${{ always() && github.event_name == 'schedule' && needs.boot-with-os.result == 'failure' }}

    runs-on: ubuntu-latest

    steps:
      # If testing on a local fork with less strict permissions, you can remove this step, and update token usage to
      # use ${{ secrets.GITHUB_TOKEN }} instead of the app token. You must also add the permission `pull-requests: write`
      # to this job.
      - name: Generate Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PATINA_AUTOMATION_APPLICATION_ID }}
          private-key: ${{ secrets.PATINA_AUTOMATION_APPLICATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Create or Comment on Failure Issue
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const date = new Date().toISOString().split('T')[0];
            // Hidden marker used to locate the persistent tracking issue for nightly OS boot failures.
            const marker = '<!-- nightly-os-boot-failure -->';

            // Look for an existing open tracking issue, identified by the hidden marker in its body.
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = openIssues.find(
              (issue) => !issue.pull_request && (issue.body || '').includes(marker)
            );

            if (existing) {
              // An issue already exists; add a comment for this run's failure.
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: [
                  `The **Nightly OS Boot Test** failed again on ${date}.`,
                  '',
                  `- Failed run: ${runUrl}`,
                  `- Commit: \`${context.sha}\``,
                ].join('\n'),
              });
            } else {
              // No existing issue; open a new tracking issue.
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Nightly OS Boot Test failed (${date})`,
                body: [
                  marker,
                  'The scheduled **Nightly OS Boot Test** workflow failed to boot one or more OS configurations.',
                  '',
                  `- Failed run: ${runUrl}`,
                  `- Commit: \`${context.sha}\``,
                  '',
                  'Please investigate the failing boot configuration(s) in the run linked above.',
                ].join('\n'),
              });
            }

  # Publishes Patina Compatibility Matrix badge data to the `badges` branch after a nightly run.
  publish-compat-matrix:
    name: Publish Compatibility Matrix
    needs:
      - boot-with-os
      - resolve-environment
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}

    runs-on: ubuntu-latest

    steps:
      - name: Generate Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PATINA_AUTOMATION_APPLICATION_ID }}
          private-key: ${{ secrets.PATINA_AUTOMATION_APPLICATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Download compatibility data
        uses: actions/download-artifact@v8
        with:
          pattern: compat-cell-*
          path: compat-artifacts/cells
          merge-multiple: true

      - name: Download OS image metadata
        uses: actions/download-artifact@v8
        with:
          pattern: '*-metadata'
          path: compat-artifacts/images
          merge-multiple: true

      - name: Generate badge and matrix data
        env:
          PATINA_SDK_VERSION: ${{ needs.resolve-environment.outputs.patina-sdk-version }}
          PATINA_DXE_CORE_QEMU_VERSION: ${{ needs.resolve-environment.outputs.patina-dxe-core-qemu-version }}
          PATINA_QEMU_COMMIT: ${{ needs.resolve-environment.outputs.patina-qemu-commit }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 .github/scripts/generate_compat_badges.py \
            --cells-dir compat-artifacts/cells \
            --images-dir compat-artifacts/images \
            --output-dir compat-output

      # The badges branch is an orphan branch containing only the generated JSON data.
      - name: Publish to badges branch
        run: |
          set -euo pipefail
          git config user.name "patina-automation[bot]"
          git config user.email "patina-automation[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git fetch origin badges:badges
            git checkout badges
            git rm -rf --ignore-unmatch data badges > /dev/null
          else
            git checkout --orphan badges
            git rm -rf . > /dev/null 2>&1 || true
          fi

          mkdir -p data badges
          cp -r compat-output/data/. data/
          cp -r compat-output/badges/. badges/

          git add data badges
          if git diff --cached --quiet; then
            echo "No compatibility matrix changes to publish."
            exit 0
          fi

          git commit -m "Update Patina compatibility matrix data (run ${{ github.run_id }})"
          git push origin badges
