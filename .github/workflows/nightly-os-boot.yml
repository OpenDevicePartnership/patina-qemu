name: "Nightly OS Boot Test"

on:
  schedule:
    - cron: '0 6 * * *'  # Runs daily at 06:00 UTC
  pull_request:
  workflow_dispatch:

jobs:
  vars:
    name: Get Repository Constants
    uses: OpenDevicePartnership/patina-devops/.github/workflows/qemu-constants.yml@main

  prepare-os-images:
    name: Prepare OS Boot Images

    needs: vars

    strategy:
      matrix:
        include:
          - img-url: ${{ needs.vars.outputs.ubuntu-x64-image }}
            artifact-name: ${{ needs.vars.outputs.ubuntu-x64-artifact }}
          - img-url: ${{ needs.vars.outputs.ubuntu-aarch64-image }}
            artifact-name: ${{ needs.vars.outputs.ubuntu-aarch64-artifact }}
          - img-url: ${{ needs.vars.outputs.windows-x64-image }}
            artifact-name: ${{ needs.vars.outputs.windows-x64-artifact }}
          - img-url: ${{ needs.vars.outputs.windows-aarch64-image }}
            artifact-name: ${{ needs.vars.outputs.windows-aarch64-artifact }}

    uses: ./.github/workflows/prepare-images.yml
    with:
      image-url: ${{ matrix.img-url }}
      artifact-name: ${{ matrix.artifact-name }}

  boot-with-os:
    name: Boot ${{ contains(matrix.os-artifact, 'windows') && 'Windows' || 'Ubuntu' }} ${{ matrix.os-boot-device }} ${{ matrix.platform }} ${{ matrix.target }}
    needs:
      - prepare-os-images
      - vars

    runs-on: 'ubuntu-latest'

    container:
      image: ${{ needs.vars.outputs.container-image }}
      options: --security-opt seccomp=unconfined

    timeout-minutes: 30

    env:
      OS_BOOT_ARTIFACTS_PATH: ./os-boot-artifacts

    strategy:
      fail-fast: false
      matrix:
        include:
          # SSD Q35 DEBUG X64 (Boot to Ubuntu)
          - config: 'Platforms/QemuQ35Pkg/PlatformBuild.py'
            target: 'DEBUG'
            platform: 'Q35'
            os-artifact: ${{ needs.vars.outputs.ubuntu-x64-artifact }}
            os-boot-device: SSD
            extra-args: PATH_TO_OS=./os-boot-artifacts/image.qcow2 PATH_TO_SEED=./os-boot-artifacts/seed.iso
          # SSD Q35 RELEASE X64 (Boot to Ubuntu)
          - config: 'Platforms/QemuQ35Pkg/PlatformBuild.py'
            target: 'RELEASE'
            platform: 'Q35'
            os-artifact: ${{ needs.vars.outputs.ubuntu-x64-artifact }}
            os-boot-device: SSD
            extra-args: PATH_TO_OS=./os-boot-artifacts/image.qcow2 PATH_TO_SEED=./os-boot-artifacts/seed.iso
          # SSD ArmVirt DEBUG (Boot to Ubuntu)
          - config: 'Platforms/QemuArmVirtPkg/PlatformBuild.py'
            target: 'DEBUG'
            platform: 'ArmVirt'
            os-artifact: ${{ needs.vars.outputs.ubuntu-aarch64-artifact }}
            os-boot-device: SSD
            extra-args: PATH_TO_OS=./os-boot-artifacts/image.qcow2 PATH_TO_SEED=./os-boot-artifacts/seed.iso
          # SSD ArmVirt RELEASE (Boot to Ubuntu)
          - config: 'Platforms/QemuArmVirtPkg/PlatformBuild.py'
            target: 'RELEASE'
            platform: 'ArmVirt'
            os-artifact: ${{ needs.vars.outputs.ubuntu-aarch64-artifact }}
            os-boot-device: SSD
            extra-args: PATH_TO_OS=./os-boot-artifacts/image.qcow2 PATH_TO_SEED=./os-boot-artifacts/seed.iso
          # SSD Q35 DEBUG X64 (Boot to Windows)
          - config: 'Platforms/QemuQ35Pkg/PlatformBuild.py'
            target: 'DEBUG'
            platform: 'Q35'
            os-artifact: ${{ needs.vars.outputs.windows-x64-artifact }}
            os-boot-device: SSD
            extra-args: PATH_TO_OS=./os-boot-artifacts/image.qcow2
          # SSD Q35 RELEASE X64 (Boot to Windows)
          - config: 'Platforms/QemuQ35Pkg/PlatformBuild.py'
            target: 'RELEASE'
            platform: 'Q35'
            os-artifact: ${{ needs.vars.outputs.windows-x64-artifact }}
            os-boot-device: SSD
            extra-args: PATH_TO_OS=./os-boot-artifacts/image.qcow2
          # SSD ArmVirt DEBUG (Boot to Windows)
          - config: 'Platforms/QemuArmVirtPkg/PlatformBuild.py'
            target: 'DEBUG'
            platform: 'ArmVirt'
            os-artifact: ${{ needs.vars.outputs.windows-aarch64-artifact }}
            os-boot-device: SSD
            extra-args: PATH_TO_OS=./os-boot-artifacts/image.qcow2
          # SSD ArmVirt RELEASE (Boot to Windows)
          - config: 'Platforms/QemuArmVirtPkg/PlatformBuild.py'
            target: 'RELEASE'
            platform: 'ArmVirt'
            os-artifact: ${{ needs.vars.outputs.windows-aarch64-artifact }}
            os-boot-device: SSD
            extra-args: PATH_TO_OS=./os-boot-artifacts/image.qcow2
          # USB Q35 DEBUG X64 (Boot to Ubuntu)
          - config: 'Platforms/QemuQ35Pkg/PlatformBuild.py'
            target: 'DEBUG'
            platform: 'Q35'
            os-artifact: ${{ needs.vars.outputs.ubuntu-x64-artifact }}
            os-boot-device: USB
            extra-args: PATH_TO_OS=./os-boot-artifacts/image.qcow2 PATH_TO_SEED=./os-boot-artifacts/seed.iso
          # USB Q35 RELEASE X64 (Boot to Ubuntu)
          - config: 'Platforms/QemuQ35Pkg/PlatformBuild.py'
            target: 'RELEASE'
            platform: 'Q35'
            os-artifact: ${{ needs.vars.outputs.ubuntu-x64-artifact }}
            os-boot-device: USB
            extra-args: PATH_TO_OS=./os-boot-artifacts/image.qcow2 PATH_TO_SEED=./os-boot-artifacts/seed.iso
          # USB ArmVirt DEBUG (Boot to Ubuntu)
          - config: 'Platforms/QemuArmVirtPkg/PlatformBuild.py'
            target: 'DEBUG'
            platform: 'ArmVirt'
            os-artifact: ${{ needs.vars.outputs.ubuntu-aarch64-artifact }}
            os-boot-device: USB
            extra-args: PATH_TO_OS=./os-boot-artifacts/image.qcow2 PATH_TO_SEED=./os-boot-artifacts/seed.iso
          # USB ArmVirt RELEASE (Boot to Ubuntu)
          - config: 'Platforms/QemuArmVirtPkg/PlatformBuild.py'
            target: 'RELEASE'
            platform: 'ArmVirt'
            os-artifact: ${{ needs.vars.outputs.ubuntu-aarch64-artifact }}
            os-boot-device: USB
            extra-args: PATH_TO_OS=./os-boot-artifacts/image.qcow2 PATH_TO_SEED=./os-boot-artifacts/seed.iso
          # USB Q35 DEBUG X64 (Boot to Windows)
          - config: 'Platforms/QemuQ35Pkg/PlatformBuild.py'
            target: 'DEBUG'
            platform: 'Q35'
            os-artifact: ${{ needs.vars.outputs.windows-x64-artifact }}
            os-boot-device: USB
            extra-args: PATH_TO_OS=./os-boot-artifacts/image.qcow2
          # USB Q35 RELEASE X64 (Boot to Windows)
          - config: 'Platforms/QemuQ35Pkg/PlatformBuild.py'
            target: 'RELEASE'
            platform: 'Q35'
            os-artifact: ${{ needs.vars.outputs.windows-x64-artifact }}
            os-boot-device: USB
            extra-args: PATH_TO_OS=./os-boot-artifacts/image.qcow2
          # USB ArmVirt DEBUG (Boot to Windows)
          - config: 'Platforms/QemuArmVirtPkg/PlatformBuild.py'
            target: 'DEBUG'
            platform: 'ArmVirt'
            os-artifact: ${{ needs.vars.outputs.windows-aarch64-artifact }}
            os-boot-device: USB
            extra-args: PATH_TO_OS=./os-boot-artifacts/image.qcow2
          # USB ArmVirt RELEASE (Boot to Windows)
          - config: 'Platforms/QemuArmVirtPkg/PlatformBuild.py'
            target: 'RELEASE'
            platform: 'ArmVirt'
            os-artifact: ${{ needs.vars.outputs.windows-aarch64-artifact }}
            os-boot-device: USB
            extra-args: PATH_TO_OS=./os-boot-artifacts/image.qcow2

    steps:
      # Checkout the repository to the runner or container
      - name: Checkout repository
        uses: actions/checkout@v7

      # Configure git for use in the container. Specifically needed for the FFA builds
      - name: Configure Git
        uses: ./.github/actions/configure-git

      # Install the pip dependencies needed to run stuart for the platform(s)
      - name: Install dependencies
        run: pip install -r pip-requirements.txt

      - name: Redirect Hafnium Submodule URLs
        uses: ./.github/actions/redirect-hafnium-urls

      - name: Download OS Boot Artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.os-artifact }}
          path: ${{ env.OS_BOOT_ARTIFACTS_PATH }}

      # Run the build-platform action, which calls stuart_setup, stuart_update, and stuart_build
      - name: Prepare and Build
        id: build-platform
        uses: ./.github/actions/build-platform
        with:
          command: 'build'
          platform-config: ${{ matrix.config }}
          platform-name: ${{ matrix.platform }}
          target: ${{ matrix.target }}
          stuart-args: 'QEMU_HEADLESS=TRUE ${{ matrix.extra-args }} OS_BOOT_DEVICE=${{ matrix.os-boot-device}}'

      - name: Run
        uses: ./.github/actions/build-platform
        with:
          command: 'flash'
          platform-config: ${{ matrix.config }}
          platform-name: ${{ matrix.platform }}
          target: ${{ matrix.target }}
          stuart-args: 'QEMU_HEADLESS=TRUE ${{ matrix.extra-args }} OS_BOOT_DEVICE=${{ matrix.os-boot-device}}'

      - name: Publish Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Specify architecture if it is not empty
          name: build-logs-${{ matrix.os-boot-device }}-${{ matrix.platform }}-${{ matrix.target }}-${{ contains(matrix.os-artifact, 'windows') && 'windows' || 'ubuntu' }}
          path: ${{ steps.build-platform.outputs.log-path }}

  # Opens a tracking issue when the scheduled (cron) run fails to boot an OS.
  # the `prepare-os-images` job sporadically fails due to network issues, which
  # would typically cause this job to run and open an issue. This job triggers only
  # when the `boot-with-os` job fails.
  report-failure:
    name: Report Nightly Failure
    needs: boot-with-os
    if: ${{ always() && github.event_name == 'schedule' && needs.boot-with-os.result == 'failure' }}

    runs-on: ubuntu-latest

    steps:
      # If testing on a local fork with less strict permissions, you can remove this step, and update token usage to
      # use ${{ secrets.GITHUB_TOKEN }} instead of the app token. You must also add the permission `pull-requests: write`
      # to this job.
      - name: Generate Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PATINA_AUTOMATION_APPLICATION_ID }}
          private-key: ${{ secrets.PATINA_AUTOMATION_APPLICATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Create or Comment on Failure Issue
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const date = new Date().toISOString().split('T')[0];
            // Hidden marker used to locate the persistent tracking issue for nightly OS boot failures.
            const marker = '<!-- nightly-os-boot-failure -->';

            // Look for an existing open tracking issue, identified by the hidden marker in its body.
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = openIssues.find(
              (issue) => !issue.pull_request && (issue.body || '').includes(marker)
            );

            if (existing) {
              // An issue already exists; add a comment for this run's failure.
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: [
                  `The **Nightly OS Boot Test** failed again on ${date}.`,
                  '',
                  `- Failed run: ${runUrl}`,
                  `- Commit: \`${context.sha}\``,
                ].join('\n'),
              });
            } else {
              // No existing issue; open a new tracking issue.
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Nightly OS Boot Test failed (${date})`,
                body: [
                  marker,
                  'The scheduled **Nightly OS Boot Test** workflow failed to boot one or more OS configurations.',
                  '',
                  `- Failed run: ${runUrl}`,
                  `- Commit: \`${context.sha}\``,
                  '',
                  'Please investigate the failing boot configuration(s) in the run linked above.',
                ].join('\n'),
              });
            }
